<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Request · Smart Stock</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
</head>
<body class="app">
  <aside id="site-header" class="sidebar"></aside>
  <!-- S6 Request form: create + edit (FR-06, FR-08) -->
  <div class="main">
    <header class="topbar"><div>
      <nav class="crumbs" aria-label="Breadcrumb"><a href="requests.html">Requests</a><i data-lucide="chevron-right" width="13" height="13"></i></nav>
      <h1 id="form-title">New request</h1>
    </div></header>
    <main class="content">
      <div id="banner"></div>
      <div id="loading"></div>

      <!-- novalidate: we show our own messages instead of the browser's pop-ups -->
      <form id="request-form" class="card form hidden" novalidate>
        <fieldset class="field">
          <legend class="label">Type</legend>
          <div class="radio-row">
            <label><input type="radio" name="type" value="replenishment" checked> Replenishment</label>
            <label><input type="radio" name="type" value="usage"> Usage report</label>
            <label><input type="radio" name="type" value="return"> Return</label>
          </div>
          <div class="field-error" id="type-error"></div>
        </fieldset>

        <div class="field">
          <label for="productId">Product</label>
          <select id="productId"><option value="">Choose a product…</option></select>
          <div class="hint" id="stock-info"></div>
          <div class="field-error" id="productId-error"></div>
        </div>

        <div class="field">
          <label for="quantity">Quantity (units)</label>
          <input id="quantity" type="number" min="1" max="100" step="1">
          <div class="hint">Enter a whole number from 1 to 100.</div>
          <div class="field-error" id="quantity-error"></div>
        </div>

        <div class="field" id="reason-field">
          <label for="reason">Reason</label>
          <select id="reason"></select>
          <div class="field-error" id="reason-error"></div>
        </div>

        <div class="field">
          <label for="notes">Notes (optional)</label>
          <textarea id="notes"></textarea>
          <div class="hint"><span id="notes-count">0</span> / 500</div>
          <div class="field-error" id="notes-error"></div>
        </div>

        <div class="form-buttons">
          <button type="submit" class="btn primary" id="save">Save request</button>
          <a class="btn" href="requests.html">Cancel</a>
        </div>
      </form>
    </main>
  </div>
  <script src="js/api.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/request-form.js"></script>
</body>
</html>
