<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Removals · Smart Stock</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Lora:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>
  <!-- S7 Unreported removals (FR-10, FR-11) -->
  <main>
    <div id="banner"></div>
    <h1>Unreported removals</h1>

    <div class="tabs">
      <button type="button" id="tab-open" class="active">Open</button>
      <button type="button" id="tab-explained">Explained</button>
    </div>

    <div id="removals"><p class="muted">Loading removals…</p></div>
  </main>

  <!-- Explain dialog (FR-11) -->
  <dialog id="explain-dialog">
    <form id="explain-form" novalidate>
      <h2>Explain removal</h2>
      <p class="muted" id="explain-summary"></p>
      <div class="field">
        <label for="reason">Reason</label>
        <select id="reason">
          <option value="">Choose a reason…</option>
          <option>Used in procedure</option>
          <option>Damaged</option>
          <option>Moved to other room</option>
          <option>Other</option>
        </select>
        <div class="field-error" id="reason-error"></div>
      </div>
      <div class="field">
        <label for="note">Note</label>
        <textarea id="note"></textarea>
        <div class="muted small"><span id="note-count">0</span> / 300 · required when the reason is "Other"</div>
        <div class="field-error" id="note-error"></div>
      </div>
      <div class="field-error" id="explain-error"></div>
      <div class="form-buttons">
        <button type="button" id="explain-cancel">Cancel</button>
        <button type="submit" class="primary" id="explain-send">Send</button>
      </div>
    </form>
  </dialog>

  <script src="js/api.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/removals.js"></script>
</body>
</html>
