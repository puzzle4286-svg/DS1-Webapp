<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unreported removals · Smart Stock</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
</head>
<body class="app">
  <aside id="site-header" class="sidebar"></aside>
  <!-- S7 Unreported removals (FR-10, FR-11) -->
  <div class="main">
    <header class="topbar"><div>
      <h1>Unreported removals</h1>
    </div></header>
    <main class="content">
      <div id="banner"></div>
      <div class="stack">
        <p class="muted" style="max-width: 800px">Each night the RFID count compares yesterday’s stock with today’s.
          Units that left the shelf without a usage report appear here. Report the usage, or explain what happened.</p>

        <div class="tabs" role="tablist">
          <button type="button" id="tab-open" class="active">Open</button>
          <button type="button" id="tab-explained">Explained</button>
        </div>

        <div id="removals"></div>
      </div>
    </main>
  </div>

  <!-- Explain dialog (FR-11) -->
  <dialog id="explain-dialog">
    <form id="explain-form" class="form" novalidate>
      <div>
        <h2>Explain removal</h2>
        <p class="muted small" id="explain-summary"></p>
      </div>
      <div class="field">
        <label for="reason">Reason</label>
        <select id="reason">
          <option value="">Choose a reason…</option>
          <option>Used in procedure</option>
          <option>Damaged</option>
          <option>Moved to other room</option>
          <option>Other</option>
        </select>
        <div class="field-error" id="reason-error"></div>
      </div>
      <div class="field">
        <label for="note">Note</label>
        <textarea id="note"></textarea>
        <div class="hint"><span id="note-count">0</span> / 300 · required when the reason is "Other"</div>
        <div class="field-error" id="note-error"></div>
      </div>
      <div class="field-error" id="explain-error"></div>
      <div class="form-buttons">
        <button type="submit" class="btn primary" id="explain-send">Send</button>
        <button type="button" class="btn" id="explain-cancel">Cancel</button>
      </div>
    </form>
  </dialog>

  <script src="js/api.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/removals.js"></script>
</body>
</html>
