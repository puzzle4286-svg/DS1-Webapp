<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Smart Stock</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
</head>
<body>
  <!-- S1 Sign in (FR-01) -->
  <main class="login-page">
    <div class="login-side">
      <div class="login-logo"><img src="img/bentley-logo.png" alt="Bentley"><span>Smart Stock</span></div>

      <form id="login-form" class="form" novalidate>
        <h1>Sign in</h1>
        <div id="banner"></div>
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="username">
          <div class="field-error" id="email-error"></div>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password">
          <div class="field-error" id="password-error"></div>
        </div>
        <button type="submit" class="btn primary" id="submit">Sign in</button>
      </form>

      <p class="muted small">© 2026 Bentley InnoMed GmbH · Demonstration data</p>
    </div>

    <div class="login-art" aria-hidden="true">
      <img src="img/bentley-blue-mark.png" alt="">
      <div class="motto">
        <p class="kicker">Bentley Smart Stock</p>
        <div>Consistency. Courage. Care.</div>
      </div>
    </div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
